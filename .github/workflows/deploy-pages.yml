name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "front/package-lock.json"

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Configure production API_URL
        if: ${{ vars.API_URL != '' }}
        working-directory: front
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          node -e "const fs = require('fs'); const p = 'src/environments/environment.ts'; const content = fs.readFileSync(p, 'utf8').replace(/API_URL:\s*['\"][^'\"]*['\"]/, 'API_URL: ' + JSON.stringify(process.env.API_URL)); fs.writeFileSync(p, content);"

      - name: Build Angular app for GitHub Pages
        working-directory: front
        run: npm run build -- --configuration production --base-href /tp-tallerweb2/

      - name: Prepare SPA fallback (404.html) and .nojekyll
        working-directory: front/dist/tp-tallerweb2/browser
        run: |
          cp index.html 404.html
          touch .nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist/tp-tallerweb2/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
