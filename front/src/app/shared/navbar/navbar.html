
<div class="fixed top-0 left-0 right-0 z-50 bg-[#ffffff] shadow-[0_1px_8px_rgba(0,0,0,0.04)]">

  <!-- Franja superior original de Stitch -->
  <div class="flex items-center justify-center gap-3 bg-[#202b36] px-4 py-1.5 text-center text-[10px] font-bold uppercase tracking-wider text-white">

    <span class="flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">local_shipping</span>
      Envíos a todo el país
    </span>

    <span class="opacity-40">•</span>

    <span class="flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">credit_card</span>
      3 y 6 Cuotas fijas
    </span>

    <span class="opacity-40">•</span>

    <span class="flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">verified</span>
      Garantía oficial directa
    </span>

  </div>

  <!-- Header principal -->
  <header class="h-16 w-full">

    <div class="mx-auto flex h-full max-w-[1360px] items-center justify-between gap-5 px-6">

      <!-- Logo -->
      <div class="flex shrink-0 items-center gap-3">

        <a
          routerLink="/productos"
          class="flex items-center gap-2"
        >
          <img
            alt="Austral Tecnología Logo"
            class="h-8 w-auto object-contain"
            src="https://lh3.googleusercontent.com/aida/AEtjO1Wzt9oqyKn_ylctrm79ZD0YOy118stboU_F9Ea8xcuU8W_4t22_9xsdTBpjBAaaHhLN7xH5q684VnBnMd9CMZRxF3kVcOM6hh9vGhnhUXcBtMLjTRQu_AKF88EXX841NaXgxWUPjq73a6HLLsCZIV-lpz1Exi51I_b9l0MJLTxrFOB-Z7Lfi4Q-GgKmAZroRHX5PKpbmQpLv8Hwv-lbvTnVWTM6toSWGF6CXMCeEUv26Q"
          />

          <span class="hidden text-xl font-semibold tracking-tight text-[#0b1721] sm:inline">
            Austral
          </span>
        </a>

      </div>

      <!-- Buscador -->
      <div class="mx-3 hidden max-w-xl flex-1 md:block">

        <div class="flex w-full items-center rounded-lg bg-[#edf4ff] px-3 py-2">

          <span class="material-symbols-outlined mr-2 text-lg text-[#44474b]">
            search
          </span>

          <input
            type="text"
            placeholder="Buscar notebooks, componentes, monitores..."
            class="w-full bg-transparent text-[13px] text-[#141c25] outline-none placeholder:text-[#44474b]"
          />

          <span class="rounded bg-[#e1e9f5] px-2 py-0.5 text-[10px] text-[#44474b]">
            ⌘K
          </span>

        </div>

      </div>

      <!-- Navegación y acciones -->
      <div class="flex shrink-0 items-center gap-5">

        <!-- Links principales -->
        <nav class="hidden items-center gap-5 lg:flex">

          <a
            routerLink="/productos"
            routerLinkActive="font-semibold text-[#0b1721]"
            class="text-[13px] text-[#44474b] transition-colors hover:text-[#141c25]"
          >
            Catálogo
          </a>

          <a
            routerLink="/productos"
            class="text-[13px] text-[#44474b] transition-colors hover:text-[#141c25]"
          >
            Notebooks
          </a>

          <a
            routerLink="/productos"
            class="text-[13px] text-[#44474b] transition-colors hover:text-[#141c25]"
          >
            Componentes
          </a>

          <a
            routerLink="/productos"
            class="text-[13px] text-[#44474b] transition-colors hover:text-[#141c25]"
          >
            Ofertas
          </a>

        </nav>

        <!-- Cuenta y carrito -->
        <div class="flex items-center gap-3 border-l border-[#e1e9f5] pl-3">

          <!-- Mi cuenta -->
          @if (authSession.currentUser(); as user) {

            <div class="flex items-center gap-2 text-[#44474b]">

              <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#0b1721]">
                <span class="material-symbols-outlined text-lg text-white">
                  person
                </span>
              </div>

              <span class="hidden text-[13px] xl:inline">
                {{ user.nombre }}
              </span>

              <button
                type="button"
                (click)="logout()"
                class="hidden text-[13px] hover:text-[#d77851] xl:inline"
              >
                Salir
              </button>

            </div>

          } @else {

            <a
              routerLink="/login"
              class="flex items-center gap-2 text-[#44474b] transition-colors hover:text-[#141c25]"
            >
              <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#0b1721]">
                <span class="material-symbols-outlined text-lg text-white">
                  person
                </span>
              </div>

              <span class="hidden text-[13px] xl:inline">
                Mi cuenta
              </span>
            </a>

          }

          <!-- Carrito -->
          <a
            routerLink="/carrito"
            class="relative flex items-center gap-2 rounded-lg bg-[#edf4ff] px-2 py-1.5 text-[#141c25] transition-colors hover:bg-[#e1e9f5]"
          >

            <span class="material-symbols-outlined text-xl">
              shopping_bag
            </span>

            <span class="hidden text-[13px] xl:inline">
              Mi carrito
            </span>

            <!-- Indicador de ejemplo de Stitch: luego lo conectaremos al carrito real -->
            <span class="flex h-5 w-5 items-center justify-center rounded-full bg-[#d77851] text-[10px] font-bold text-white">
              2
            </span>

          </a>

        </div>

      </div>

    </div>

  </header>

</div>
