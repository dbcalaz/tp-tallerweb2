@if (authSession.isAuthenticated()) {
  <app-navbar />

  <!-- Espacio para compensar el navbar fijo -->
  <div class="h-[94px]"></div>
} @else {
  <header class="auth-topbar">
    <a class="auth-brand" routerLink="/login" aria-label="Tecnova, ir al inicio">tecnova<span>.</span></a>
  </header>
}

@if (toast.message()) {
  <div class="success-toast" role="status" aria-live="polite">
    {{ toast.message() }}
  </div>
}

<div class="app-content">
  <router-outlet />
</div>

@if (authSession.isAuthenticated()) {
  <app-footer />
}
