  <article  [routerLink]="['/productos', producto().id]" class="bg-surface-container-lowest rounded-lg p-space-md flex flex-col justify-between shadow-sm hover:shadow-md transition-shadow group">
    <div class="space-y-space-sm">
      <div class="flex items-center justify-between">
        <span class="font-label-xs text-label-xs px-2 py-0.5 rounded bg-surface-container-high text-on-surface font-bold tracking-wider uppercase">
          {{ producto().marca }}
        </span>
        <span
          class="flex items-center gap-1 font-label-xs text-label-xs px-2 py-0.5 rounded font-bold"
          [class.text-tertiary-container]="!enStock()"
          [class.bg-tertiary-fixed]="!enStock()"
          [class.text-secondary-container]="enStock()"
          [class.bg-primary-container]="enStock()"
        >
          <span
            class="w-1.5 h-1.5 rounded-full"
            [class.bg-error]="!enStock()"
            [class.bg-on-tertiary-container]="enStock()"
          ></span>
          {{ stockLabel() }}
        </span>
      </div>
      <div class="relative w-full aspect-square bg-surface-container-low rounded flex items-center justify-center p-3 overflow-hidden">
        <img
          class="object-contain w-full h-full mix-blend-multiply group-hover:scale-105 transition-transform duration-300"
          [src]="producto().imagenUrl"
          [alt]="producto().nombre"
        />
      </div>
      <div>
        <p class="font-label-xs text-label-xs uppercase tracking-wider text-secondary">
          {{ producto().tipo }}
        </p>
        <h3 class="font-title-md text-title-md text-primary font-semibold line-clamp-2 leading-tight">
          {{ producto().nombre }}
        </h3>
        <p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1 mt-1">
          {{ producto().descripcion }}
        </p>
      </div>
    </div>
    <div class="mt-space-md pt-space-xs space-y-space-xs">
      <div>
        <span class="font-price-display text-price-display text-on-tertiary-container block">
          {{ producto().precio | currency: 'ARS' : 'symbol-narrow' : '1.0-0' }}
        </span>
        <span class="font-price-installment text-price-installment text-secondary">
          6 cuotas fijas de {{ cuota() | currency: 'ARS' : 'symbol-narrow' : '1.0-0' }}
        </span>
      </div>
      <button class="w-full h-9 flex items-center justify-center gap-1.5 bg-on-tertiary-container text-on-primary font-label-md text-label-md rounded hover:bg-tertiary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-on-tertiary-container" type="button" (click)="addToCart(); $event.stopPropagation()" [disabled]="stockDisponible() === 0">
        <span class="material-symbols-outlined text-[16px]">add_shopping_cart</span>
        <span>{{ stockDisponible() === 0 ? 'Sin stock' : 'Agregar' }}</span>
      </button>
    </div>
  </article>
