<header class="fixed top-0 left-0 right-0 z-40 bg-surface-container-low/95 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.45)]">
  <div class="relative h-14 w-full px-3 sm:px-gutter-desktop flex items-center justify-between gap-space-sm sm:px-4">
    <div class="flex items-center gap-space-md min-w-0">
      <div class="flex items-center gap-space-sm min-w-0">
        <span class="font-headline-sm text-sm sm:text-headline-sm tracking-tight text-on-surface font-semibold truncate">Tecnova <span class="text-primary">•</span> Admin</span>
        <span class="hidden md:inline-block font-label-sm text-label-sm uppercase px-space-sm py-space-2xs bg-surface-container text-on-surface-variant rounded tracking-wider shrink-0">PANEL DE CONTROL</span>
      </div>
    </div>
    <div class="flex items-center gap-space-sm sm:gap-space-lg">
      <nav class="hidden sm:flex items-center gap-space-xs">
        <a
          routerLink="/admin/productos"
          routerLinkActive
          #productos="routerLinkActive"
          class="px-space-md py-space-xs rounded font-label-md text-label-md transition-colors"
          [class]="productos.isActive ? 'bg-primary-container text-on-primary' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
          >Productos</a
        >
        <a
          routerLink="/admin/categorias"
          routerLinkActive
          #categorias="routerLinkActive"
          class="px-space-md py-space-xs rounded font-label-md text-label-md transition-colors"
          [class]="categorias.isActive ? 'bg-primary-container text-on-primary' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
          >Categorías</a
        >
      </nav>
      <button type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuAbierto" aria-label="Abrir navegación de administración" class="flex h-9 w-9 items-center justify-center rounded text-on-surface hover:bg-surface-container-high sm:hidden">
        <span class="material-symbols-outlined">{{ menuAbierto ? 'close' : 'menu' }}</span>
      </button>
      @if (menuAbierto) {
        <nav class="absolute right-3 top-full z-50 mt-2 flex w-48 flex-col rounded-lg border border-surface-container-high bg-surface-container-lowest p-2 shadow-lg sm:hidden" aria-label="Navegación de administración">
          <a routerLink="/admin/productos" (click)="cerrarMenu()" class="rounded px-3 py-3 text-sm text-on-surface hover:bg-surface-container">Productos</a>
          <a routerLink="/admin/categorias" (click)="cerrarMenu()" class="rounded px-3 py-3 text-sm text-on-surface hover:bg-surface-container">Categorías</a>
        </nav>
      }
      <div class="flex items-center gap-space-xs sm:gap-space-md sm:pl-space-md">
        <button
          type="button"
          class="h-8 px-space-sm inline-flex items-center gap-space-xs text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors rounded font-label-md text-label-md"
          title="Cerrar sesión"
          (click)="cerrarSesion()"
        >
          <span class="material-symbols-outlined text-[18px]">logout</span>
          <span class="hidden lg:inline">Cerrar sesión</span>
        </button>
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
        </div>
      </div>
    </div>
  </div>
</header>
